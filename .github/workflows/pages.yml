name: 部署自拍 App 到 GitHub Pages

# 只發佈 selfie/ 這個資料夾。repo 裡其他內容（慈善系統）不會出現在網站上。
on:
  push:
    branches: [selfie-app, main]
    paths:
      - "selfie/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 會在 Pages 還沒開啟時自動開啟，不用進 Settings 手動設定
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./selfie

      - id: deployment
        uses: actions/deploy-pages@v4
