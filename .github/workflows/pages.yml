name: 部署自拍 App 到 GitHub Pages

# 發佈整個 repo，維持原本的網站結構：
#   /         → 慈善公益團體管理系統（原本就在的 index.html）
#   /selfie/  → 自拍美顏 App
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 把 Pages 來源設成 GitHub Actions（若尚未啟用則一併啟用）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
